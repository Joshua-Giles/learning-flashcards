name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, validate sets, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular CLI 22 needs Node ^22.22.3 or ^24.15.0; "22" resolves to the latest 22.x.
          node-version: '22'
          cache: npm

      - run: npm ci

      # lint + prettier check + set validator tests + sets:check + unit tests + production build
      - run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (includes axe accessibility checks)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
