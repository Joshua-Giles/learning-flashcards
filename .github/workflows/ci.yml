name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, validate sets, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular CLI 22 needs Node ^22.22.3 or ^24.15.0; "22" resolves to the latest 22.x.
          node-version: '22'
          cache: npm

      - run: npm ci

      # lint + prettier check + set validator tests + sets:check + unit tests + production build
      - run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (includes axe accessibility checks)
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    # Only after a green verify job, and only for pushes to main (never for PRs).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Builds with <base href="/learning-flashcards/"> and adds the 404.html SPA fallback.
      - run: npm run build:pages

      - uses: actions/configure-pages@v6

      # Name the artifact per attempt: "Re-run failed jobs" re-uploads, and deploy-pages
      # refuses to pick between two artifacts with the same name in one run.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/learning-flashcards/browser

      # GitHub's Pages API occasionally fails transiently ("try again later",
      # "artifact metadata" errors). Retry once after a short pause.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
